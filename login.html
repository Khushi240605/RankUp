<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>RankUp - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { primary: "#103bbc" },
      fontFamily: { display: ["Manrope"] },
    },
  },
};
</script>
<style>
body { background: linear-gradient(135deg,#ffffff,#a7baef); }
.material-symbols-outlined { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
.error-msg { display:none; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:12px; }
.error-msg.show { display:block; }
</style>
</head>

<body class="font-display text-gray-800">
<div class="flex items-center justify-center min-h-screen px-4">
  <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md border border-gray-200">

    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 text-primary mb-2">
        <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M47.24 24L24 47.24 0.76 24 24 0.76 47.24 24ZM12.24 21h23.52L24 9.24 12.24 21Z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold text-gray-900">RankUp</h1>
      <p class="text-gray-500 mt-1">Welcome Back! Please login below</p>
    </div>

    <!-- Error message -->
    <div class="error-msg" id="error-msg">❌ <span id="error-text"></span></div>

    <form class="space-y-5" id="loginForm">
      <div>
        <input id="username" type="text" required placeholder="Username or Email"
               class="w-full px-4 py-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" />
      </div>
      <div>
        <input id="password" type="password" required placeholder="Password"
               class="w-full px-4 py-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-900 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" />
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" id="rememberMe" class="mr-2 rounded border-gray-300 text-primary focus:ring-primary" />
          Remember Me
        </label>
        <a href="#" class="text-sm text-primary hover:underline">Forgot password?</a>
      </div>

      <button type="submit"
              class="w-full bg-primary text-white font-bold py-3 rounded-lg hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
        Log In
      </button>

      <button type="button"
              class="w-full flex items-center justify-center gap-2 border border-gray-300 py-3 rounded-lg hover:bg-gray-50 transition">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5" />
        <span class="font-medium text-gray-700">Log in with Google</span>
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-500">
        Don't have an account?
        <a href="signup.html" class="text-primary font-semibold hover:underline">Sign up</a>
      </p>
    </div>

    <div class="text-center mt-4 text-gray-400 text-xs flex items-center justify-center gap-1">
      <span class="material-symbols-outlined text-sm">lock</span>
      End-to-end encrypted.
    </div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const input    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const errorMsg = document.getElementById('error-msg');
  const errorTxt = document.getElementById('error-text');

  // Get all registered users
  const users = JSON.parse(localStorage.getItem('rankup_users') || '[]');

  // Find user by email or username
  const user = users.find(u =>
    (u.email === input || u.username === input) && u.password === password
  );

  if (!user) {
    errorTxt.textContent = 'Invalid email/username or password.';
    errorMsg.classList.add('show');
    return;
  }

  // Save logged-in user to session
  localStorage.setItem('rankup_current_user', JSON.stringify({
    name:     user.name,
    email:    user.email,
    username: user.username,
  }));

  // Redirect to dashboard
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
